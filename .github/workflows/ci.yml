name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax validation
        run: npm run check
      - name: Unit and API contract tests
        run: npm test
      - name: Verify static assets
        run: |
          test -s index.html
          test -s styles.css
          test -s src/core.js
          test -s src/api.js
          test -s src/app.js
          test -s favicon.svg
          test -f .nojekyll
