name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Syntax validation
        run: npm run check
      - name: Unit and API contract tests
        run: npm test
      - name: Install browser test runner
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance tests
        run: npm run test:browser
      - name: Verify static assets
        run: |
          test -s index.html
          test -s styles.css
          test -s src/core.js
          test -s src/api.js
          test -s src/app.js
          test -s src/snapshot.js
          test -s favicon.svg
          test -s open-source/index.html
          test -s open-source/style.css
          test -f .nojekyll
